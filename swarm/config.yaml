# AI Swarm - Global Configuration
# ================================

# Default models
models:
  router: opus
  router_thinking: false    # Fast dispatch, no deep reasoning
  worker: sonnet
  worker_thinking: true

# Formation modes
formations:
  default:
    router: opus
    router_thinking: false
    worker: sonnet
    worker_thinking: true

  battle:                   # 全員Opus
    router: opus
    router_thinking: true
    worker: opus
    worker_thinking: true

# Workers per team (same for all teams)
workers_per_team: 5

# Task lifecycle (Router manages this per task, not rigid)
# Just a reference for Router's judgment.
lifecycle_phases:
  - research      # 調査
  - plan          # 設計
  - execute       # 実装
  - review        # レビュー
  - improve       # 改善

# Autonomy levels
autonomy:
  default_level: L1

  levels:
    L1: "全gateでユーザー確認"
    L2: "戦略判断のみ確認"
    L3: "異常時のみ報告"

  always_ask:
    - "予算を伴う判断"
    - "外部への公開・送信"
    - "既存の方針の変更"

# Cost control
cost:
  polling: forbidden
  clear_after_task: true
  max_concurrent_opus: 4    # battle mode以外でのOpus同時数上限

# Timeouts
timeouts:
  task_stale_minutes: 10
  worker_idle_minutes: 30

# File paths
paths:
  teams_dir: "swarm/teams"
  projects_dir: "swarm/projects"
  results_dir: "swarm/results"
